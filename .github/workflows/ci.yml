name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats bc jq wireguard-tools qrencode

      - name: Check Bash Syntax
        run: |
          bash -n *.sh

      - name: Run BATS Unit Tests
        run: |
          bats tests/
